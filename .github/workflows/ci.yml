name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          cache-paths: .local/share/pnpm/store
          cache-key-files: pnpm-lock.yaml
          command: |
            pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store
            pnpm --filter @tashi/shared build
            pnpm check
            pnpm typecheck
            pnpm test:unit

  e2e:
    name: Browser tests
    runs-on: ubuntu-26.04
    env:
      E2E_WORKERS: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          env: E2E_WORKERS
          apt-packages: >-
            fonts-liberation libasound2 libatk-bridge2.0-0 libatk1.0-0 libatspi2.0-0 libcairo2 libcups2
            libdbus-1-3 libdrm2 libfontconfig1 libgbm1 libglib2.0-0 libnspr4 libnss3 libpango-1.0-0
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2
          cache-paths: |
            .cache/ms-playwright
            .local/share/pnpm/store
          cache-key-files: pnpm-lock.yaml
          command: |
            pnpm install --frozen-lockfile --store-dir ~/.local/share/pnpm/store
            pnpm --filter @tashi/e2e exec playwright install chromium
            pnpm test:e2e
            E2E_RUNTIME=node pnpm --filter @tashi/e2e test

  nix:
    name: Nix package
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      # zizmor: ignore[artipacked]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}
      # A dependency update changes the hash of the pnpm dependencies; on a
      # branch of this repository, such as Renovate's, the job commits the
      # new one instead of failing.
      - uses: fnune/ci@395771a1db7789d50e1070d49e746465de179042
        with:
          dev-shell: ""
          command: |
            scripts/update-nix-hash
            nix build .#default
      - name: Commit the new hash
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git diff --quiet nix/package.nix && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Update the Nix hash of the pnpm dependencies"
          git push
      - name: Fail on a stale hash elsewhere
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
        run: git diff --exit-code nix/package.nix
